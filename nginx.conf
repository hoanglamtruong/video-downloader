server {
    listen 80;
    server_name _;   # Thay bằng IP hoặc domain nội bộ nếu có

    # Tăng giới hạn upload (cho phép gửi URL dài)
    client_max_body_size 10M;

    # Timeout dài hơn cho download video
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve file download trực tiếp qua nginx (tăng hiệu suất)
    location /downloads/ {
        alias /opt/zdown/downloads/;
        add_header Content-Disposition 'attachment';
        internal;
    }
}
