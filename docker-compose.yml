services:
  zdown:
    build: .
    container_name: zdown
    ports:
      - "8097:8097"
    env_file: .env
    environment:
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - FFPROBE_PATH=/usr/bin/ffprobe
    volumes:
      - ./downloads:/app/downloads
      - ./frames:/app/frames
    restart: unless-stopped
    networks:
      - homelab-net
networks:
  homelab-net:
    external: true
